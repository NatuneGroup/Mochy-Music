name: Signed arm64 release APK

# The one place the signed release APK is built: Build PR's manual release run, the
# nightly on dev and the stable release on main all call this, so the signing steps
# exist once. It only builds and uploads a workflow artifact; publishing is the caller's.
on:
  workflow_call:
    inputs:
      flavour:
        description: "Foss or Gms"
        type: string
        default: Foss
      compress_native_libs:
        type: boolean
        default: false
      version_code:
        description: "Android versionCode for this build; empty keeps the one in app/build.gradle.kts"
        type: string
        default: ""
      version_name:
        description: "versionName for this build; empty keeps the one in app/build.gradle.kts"
        type: string
        default: ""
      nightly:
        description: "Marks the build as a nightly (BuildConfig.IS_NIGHTLY)"
        type: boolean
        default: false
      ref:
        description: "Commit to build; empty builds the commit that triggered the caller"
        type: string
        default: ""
      artifact_name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed arm64 release
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # a release only ever ships with the repository's own key: every debug-keyed build
      # used a runner's throwaway key, so none of them could update the one before
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build signed arm64 release
        run: |
          set -euo pipefail
          args=("assembleArm64${RELEASE_FLAVOUR}Release" "-Pmochy.compressNativeLibs=$COMPRESS_NATIVE_LIBS")
          # every signed APK gets a code above the last one, a manual test build included: one left
          # at the floor would refuse to install over a nightly ("downgrade"); same rule as release_version.py
          if [ -z "$VERSION_CODE" ]; then
            floor=$(sed -n 's/^ *val versionCodeFloor = \([0-9]*\).*/\1/p' app/build.gradle.kts)
            test -n "$floor" || { echo "versionCodeFloor not found in app/build.gradle.kts"; exit 1; }
            VERSION_CODE=$(( floor + $(date +%s) / 60 ))
          fi
          args+=("-Pmochy.versionCode=$VERSION_CODE")
          if [ -n "$VERSION_NAME" ]; then args+=("-Pmochy.versionName=$VERSION_NAME"); fi
          if [ "$NIGHTLY" = "true" ]; then args+=("-Pnightly=true"); fi
          ./gradlew --console=plain "${args[@]}" --warning-mode summary
        env:
          RELEASE_FLAVOUR: ${{ inputs.flavour }}
          COMPRESS_NATIVE_LIBS: ${{ inputs.compress_native_libs }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          NIGHTLY: ${{ inputs.nightly }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          # what makes these the official builds the module store answers (build.yml passes it too)
          MODULE_STORE_KEY: ${{ secrets.MODULE_STORE_KEY }}

      - name: Check the release is signed with the repository key
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/arm64*/release/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee signer.txt
            grep -q 'CN=Mochy (NatuneGroup)' signer.txt || { echo "not signed with the repository key"; exit 1; }
            ls -l "$apk"; sha256sum "$apk"
            python3 - "$apk" <<'PY'
          import sys
          from collections import Counter
          from zipfile import ZipFile

          sizes = Counter()
          with ZipFile(sys.argv[1]) as package:
              for entry in package.infolist():
                  group = 'DEX' if entry.filename.endswith('.dex') else entry.filename.split('/')[0]
                  sizes[group] += entry.compress_size
          for name, size in sizes.most_common(5):
              print(f'{name}: {size:,} bytes in the APK')
          PY
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: app/build/outputs/apk/arm64*/release/*.apk
          if-no-files-found: error
          retention-days: 30
