name: Nightly release

# Every push to dev builds the signed Foss arm64 APK and publishes it as a GitHub
# prerelease (v8.4.3.1, v8.4.3.2 ...), the shape of Natune's nightly. Skipped when dev
# hasn't moved since the last nightly. The app's Nightly update channel installs these.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      force:
        description: Build even when dev has no commits since the previous nightly
        type: boolean
        default: false

permissions:
  contents: read

# one at a time, so two runs never pick the same nightly number
concurrency:
  group: mochy-nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Check nightly changes and select version
    if: github.repository == 'NatuneGroup/Mochy-Music' && github.ref == 'refs/heads/dev'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide whether to build
        id: version
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_version.py nightly | tee -a "$GITHUB_OUTPUT" > plan.txt
          { echo "notes<<MOCHY_NOTES_EOF"; cat release-notes.md; echo "MOCHY_NOTES_EOF"; } >> "$GITHUB_OUTPUT"
          if grep -qx 'unchanged=true' plan.txt && [ "${FORCE:-false}" != "true" ]; then
            echo "No new commits since the last nightly; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish nightly
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/_publish-release.yml
    with:
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      version_name: ${{ needs.prepare.outputs.version_name }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      notes: ${{ needs.prepare.outputs.notes }}
    secrets: inherit
    permissions:
      contents: write
