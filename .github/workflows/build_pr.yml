name: Build PR

# One-off ARM64 package for the current dev integration.
on: workflow_dispatch

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Lint ARM64 FOSS Debug APK
        run: ./gradlew --console=plain :app:assembleArm64FossDebug :app:lintArm64FossDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      - name: Verify ARM64-only APK and signature
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/arm64Foss/debug/*.apk)
          test "${#apks[@]}" -eq 1
          abis=$(unzip -Z1 "${apks[0]}" | awk -F/ '$1 == "lib" && $3 ~ /[.]so$/ {print $2}' | sort -u)
          printf 'APK native ABIs: %s\n' "$abis"
          test "$abis" = arm64-v8a
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "${apks[0]}"
          sha256sum "${apks[0]}"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: mochy-arm64-v8a-foss-debug-${{ github.event.number || github.sha }}
          path: app/build/outputs/apk/arm64Foss/debug/*.apk
          # a pr's apk is for trying it before merging, after a week it's just eating actions storage
          retention-days: 7
