name: Build PR

# Full universal assemble + lint. Pull requests into dev use the smaller
# Fast checks workflow; this one runs after they land, and on demand.
on:
  pull_request:
    branches-ignore: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      release:
        description: "Leave at none for the debug build; Foss or Gms builds a signed arm64 release instead"
        type: choice
        options: [none, Foss, Gms]
        default: none
      compress_native_libs:
        description: "Compress native libraries for a smaller sideload APK"
        type: boolean
        default: false

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Lint Universal FOSS Debug APK
        if: ${{ !inputs.release || inputs.release == 'none' }}
        run: ./gradlew --console=plain assembleUniversalFossDebug :app:lintUniversalFossDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      - name: Upload APK
        if: ${{ !inputs.release || inputs.release == 'none' }}
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-debug-${{ github.event.number || github.sha }}
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          # a pr's apk is for trying it before merging, after a week it's just eating actions storage
          retention-days: 7

      # a release only ever ships with the repository's own key: every debug-keyed build
      # used a runner's throwaway key, so none of them could update the one before
      - name: Decode release keystore
        if: ${{ inputs.release == 'Foss' || inputs.release == 'Gms' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build signed arm64 release
        if: ${{ inputs.release == 'Foss' || inputs.release == 'Gms' }}
        run: >-
          ./gradlew --console=plain "assembleArm64${RELEASE_FLAVOUR}Release"
          -Pmochy.compressNativeLibs="$COMPRESS_NATIVE_LIBS" --warning-mode summary
        env:
          RELEASE_FLAVOUR: ${{ inputs.release }}
          COMPRESS_NATIVE_LIBS: ${{ inputs.compress_native_libs }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      - name: Check the release is signed with the repository key
        if: ${{ inputs.release == 'Foss' || inputs.release == 'Gms' }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/arm64*/release/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee signer.txt
            grep -q 'CN=Mochy (NatuneGroup)' signer.txt || { echo "not signed with the repository key"; exit 1; }
            ls -l "$apk"; sha256sum "$apk"
            python3 - "$apk" <<'PY'
          import sys
          from collections import Counter
          from zipfile import ZipFile

          sizes = Counter()
          with ZipFile(sys.argv[1]) as package:
              for entry in package.infolist():
                  group = 'DEX' if entry.filename.endswith('.dex') else entry.filename.split('/')[0]
                  sizes[group] += entry.compress_size
          for name, size in sizes.most_common(5):
              print(f'{name}: {size:,} bytes in the APK')
          PY
          done

      - name: Upload release APK
        if: ${{ inputs.release == 'Foss' || inputs.release == 'Gms' }}
        uses: actions/upload-artifact@v6
        with:
          name: mochy-arm64-${{ inputs.release }}-release${{ inputs.compress_native_libs && '-compressed' || '' }}-${{ github.sha }}
          path: app/build/outputs/apk/arm64*/release/*.apk
          retention-days: 30
