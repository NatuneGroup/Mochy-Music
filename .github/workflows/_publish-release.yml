name: Build and publish a release

# Called by nightly.yml (prerelease) and release.yml (stable): builds the signed Foss and Gms
# arm64 APK through _release-apk.yml, then publishes it as a GitHub release. The in-app
# updater (core/updater/GithubUpdates.kt) reads these releases: Release sees the stable
# ones, Nightly sees the prereleases too and takes the newest.
on:
  workflow_call:
    inputs:
      channel:
        description: "nightly or stable"
        type: string
        required: true
      version:
        type: string
        required: true
      tag_name:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      notes:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    # both flavours, so a Gms install (Cast) updates to Gms and a Foss one to Foss
    strategy:
      matrix:
        flavour: [Foss, Gms]
    permissions:
      contents: read
    uses: ./.github/workflows/_release-apk.yml
    with:
      flavour: ${{ matrix.flavour }}
      ref: ${{ inputs.commit_sha }}
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      nightly: ${{ inputs.channel == 'nightly' }}
      artifact_name: mochy-${{ inputs.channel }}-${{ inputs.version }}-${{ matrix.flavour }}
    secrets: inherit

  publish:
    name: Publish ${{ inputs.channel }} release
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mochy-${{ inputs.channel }}-${{ inputs.version }}-Foss
          path: built/foss

      - uses: actions/download-artifact@v7
        with:
          name: mochy-${{ inputs.channel }}-${{ inputs.version }}-Gms
          path: built/gms

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ inputs.tag_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # the updater picks the asset named for the installed ABI and flavour
          assets=()
          for flavour in foss gms; do
            # upload-artifact keeps the glob's wildcard folder (arm64Foss/release/), so the APK is not
            # directly under built/<flavour>; find it instead of assuming one level
            mapfile -t apks < <(find "built/$flavour" -type f -name '*.apk')
            [ "${#apks[@]}" -eq 1 ] && [ -f "${apks[0]}" ] || { echo "expected one $flavour APK, got: ${apks[*]:-none}"; exit 1; }
            asset="mochy-${VERSION}-arm64-${flavour}.apk"
            mv "${apks[0]}" "$asset"
            sha256sum "$asset" | tee "$asset.sha256"
            assets+=("$asset" "$asset.sha256")
          done

          {
            if [ "$CHANNEL" = nightly ]; then
              echo "Nightly build of \`dev\` at ${COMMIT_SHA:0:9}. Pick the Nightly channel in the app's version sheet to get these."
            else
              echo "Mochy ${VERSION}."
            fi
            echo
            echo "$NOTES"
            echo
            echo "Signed arm64 APKs: foss, and gms (with Cast). Each updates an earlier Mochy release of the same kind from this repository."
            echo
            echo "Mochy is built on Mochy Music by realidkroo: https://github.com/realidkroo/mochy-music"
          } > notes.md

          title="Mochy ${VERSION}"
          flags=()
          if [ "$CHANNEL" = nightly ]; then
            title="$title nightly"
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "$title" \
            --notes-file notes.md \
            "${flags[@]}"
