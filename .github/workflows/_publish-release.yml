name: Build and publish a release

# Called by nightly.yml (prerelease) and release.yml (stable): builds the signed Foss
# arm64 APK through _release-apk.yml, then publishes it as a GitHub release. The in-app
# updater (core/updater/GithubUpdates.kt) reads these releases: Release sees the stable
# ones, Nightly sees the prereleases too and takes the newest.
on:
  workflow_call:
    inputs:
      channel:
        description: "nightly or stable"
        type: string
        required: true
      version:
        type: string
        required: true
      tag_name:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      notes:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_release-apk.yml
    with:
      flavour: Foss
      ref: ${{ inputs.commit_sha }}
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      nightly: ${{ inputs.channel == 'nightly' }}
      artifact_name: mochy-${{ inputs.channel }}-${{ inputs.version }}
    secrets: inherit

  publish:
    name: Publish ${{ inputs.channel }} release
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mochy-${{ inputs.channel }}-${{ inputs.version }}
          path: built

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ inputs.tag_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          apks=(built/*.apk)
          [ "${#apks[@]}" -eq 1 ] && [ -f "${apks[0]}" ] || { echo "expected one APK, got: ${apks[*]}"; exit 1; }
          # the updater picks the asset named for the installed ABI and flavour
          asset="mochy-${VERSION}-arm64-foss.apk"
          mv "${apks[0]}" "$asset"
          sha256sum "$asset" | tee "$asset.sha256"

          {
            if [ "$CHANNEL" = nightly ]; then
              echo "Nightly build of \`dev\` at ${COMMIT_SHA:0:9}. Pick the Nightly channel in the app's version sheet to get these."
            else
              echo "Mochy ${VERSION}."
            fi
            echo
            echo "$NOTES"
            echo
            echo "Signed arm64 Foss APK; it updates any earlier Mochy release from this repository."
            echo
            echo "Mochy is built on Mochy Music by realidkroo: https://github.com/realidkroo/mochy-music"
          } > notes.md

          title="Mochy ${VERSION}"
          flags=()
          if [ "$CHANNEL" = nightly ]; then
            title="$title nightly"
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG_NAME" "$asset" "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "$title" \
            --notes-file notes.md \
            "${flags[@]}"
