name: iOS compile

# Compiles the shared modules for the iOS simulator on the org's Blacksmith macOS runner, links the
# Shared framework and type-checks the Swift host against it. Linux skips iOS targets, so this is the
# only signal for iosMain. Runs only when iOS-facing sources change, to keep macOS minutes bounded.
on:
  pull_request:
    branches: [dev]
    paths:
      - 'shared/**'
      - 'providers/innertube/**'
      - 'iosApp/**'
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ios_compile.yml'
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator compile and Swift type-check
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore the Kotlin/Native cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - run: chmod +x gradlew

      # Configure-on-demand keeps Gradle from configuring :app (and its pinned NDK) for iOS-only tasks.
      - name: Compile the shared modules for the iOS simulator
        run: >-
          ./gradlew --console=plain -Dorg.gradle.configureondemand=true --continue
          :providers:innertube:compileKotlinIosSimulatorArm64
          :shared:compileKotlinIosSimulatorArm64

      - name: Link the simulator framework
        run: ./gradlew --console=plain -Dorg.gradle.configureondemand=true :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Type-check the Swift host against the framework
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORKS="shared/build/bin/iosSimulatorArm64/debugFramework"
          test -d "$FRAMEWORKS/Shared.framework"
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library \
            -swift-version 5 \
            -target arm64-apple-ios17.0-simulator \
            -F "$FRAMEWORKS" \
            iosApp/*.swift

      - name: Build the simulator app with Xcode
        shell: bash
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/mochy-ios"
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO build
          app="$derived_data/Build/Products/Debug-iphonesimulator/Mochy.app"
          test -x "$app/Mochy"
          test -n "$(find "$app" -name inter_regular.ttf -print -quit)"

      - name: Compile shared code for an ARM64 iPhone
        run: ./gradlew --console=plain -Dorg.gradle.configureondemand=true :shared:compileKotlinIosArm64

      - name: Install and launch the iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mochy-ios/Build/Products/Debug-iphonesimulator/Mochy.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")]; print(next((d["udid"] for d in devices if d["state"] == "Booted"), devices[-1]["udid"] if devices else ""))')
          test -n "$device"
          if ! xcrun simctl boot "$device"; then
            xcrun simctl list devices | grep -F "$device" | grep -F Booted
          fi
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          launch=$(xcrun simctl launch --terminate-running-process "$device" "$bundle_id")
          echo "$launch"
          app_pid=${launch##*: }
          sleep 8
          xcrun simctl spawn "$device" launchctl list | awk -v pid="$app_pid" '$1 == pid { print; found=1 } END { exit !found }'
