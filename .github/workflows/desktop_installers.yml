name: Desktop installers

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/desktop_installers.yml'
      - 'desktopApp/**'
      - 'shared/build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: blacksmith-8vcpu-ubuntu-2404
          - platform: macos-arm64
            runner: blacksmith-6vcpu-macos-26
          - platform: windows-x64
            runner: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm xvfb xauth

      - name: Add WiX 3 to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' |
              Where-Object { Test-Path (Join-Path $_.FullName 'bin\candle.exe') } |
              Select-Object -First 1
          if (-not $wix) { throw 'WiX 3 is required by JDK 21 to package the MSI.' }
          (Join-Path $wix.FullName 'bin') >> $env:GITHUB_PATH

      - name: Build the native installers
        if: runner.os != 'Windows'
        run: ./gradlew --console=plain -Dorg.gradle.configureondemand=true :desktopApp:packageDistributionForCurrentOS

      - name: Build the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat --console=plain "-Dorg.gradle.configureondemand=true" :desktopApp:packageMsi

      - name: Smoke-test the Linux app window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          launch=$(find desktopApp/build/compose/binaries/main/app -type f -path '*/bin/Mochy' -print -quit)
          test -x "$launch"
          startup_log="$RUNNER_TEMP/mochy-startup.log"
          result=0
          timeout 18s xvfb-run -a "$launch" > "$startup_log" 2>&1 || result=$?
          cat "$startup_log"
          test "$result" -eq 124

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: Mochy-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.rpm
            desktopApp/build/compose/binaries/main/**/*.dmg
            desktopApp/build/compose/binaries/main/**/*.msi
